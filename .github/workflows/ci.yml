name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.1"
  # Use the interpreter actions/setup-python provides; never download one.
  UV_PYTHON_PREFERENCE: "only-system"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run Ruff linter
        run: uv run --no-sync ruff check src/ tests/
      - name: Run Ruff formatter check
        run: uv run --no-sync ruff format --check src/ tests/

  typecheck:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run Mypy
        run: uv run --no-sync mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run hermetic tests
        env:
          AGENCY_LLM_PROVIDER: echo
          AGENCY_LLM_MODEL: echo
          AGENCY_BETA_MODE: "0"
          TELEGRAM_BOT_TOKEN: ""
        run: uv run --no-sync pytest tests/ -v --tb=short --cov=agency --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  ui-tests:
    name: UI Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run Node UI tests
        run: node --test tests/*.test.mjs

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run security tests
        run: uv run --no-sync pytest tests/test_security_red.py tests/test_security_blue.py tests/test_security_purple.py tests/test_security_sandbox.py -v --tb=short
