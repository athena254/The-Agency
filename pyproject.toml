[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theagency"
version = "0.1.0"
description = "Security-first autonomous agent system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Danny Dis", email = "muriukidismas9@gmail.com"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.0",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
neo4j = ["neo4j>=5.0"]
qdrant = ["qdrant-client>=1.0"]
ollama = ["ollama>=0.3.0"]
llm = ["litellm>=1.0", "openai>=1.0", "anthropic>=0.40.0"]

[project.scripts]
agency = "agency.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agency"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
