version: "3.9"

services:
  agency:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AGENCY_LLM_PROVIDER=${AGENCY_LLM_PROVIDER:-openai}
      - AGENCY_LLM_MODEL=${AGENCY_LLM_MODEL:-gpt-4o-mini}
      - AGENCY_LLM_API_KEY=${AGENCY_LLM_API_KEY}
      - AGENCY_TELEGRAM_BOT_TOKEN=${AGENCY_TELEGRAM_BOT_TOKEN}
      - AGENCY_TELEGRAM_OWNER_ID=${AGENCY_TELEGRAM_OWNER_ID}
      - AGENCY_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: theagency
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data:
