[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generated-app"
version = "0.1.0"
description = "Minimal FastAPI app generated by Forge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["test_app.py"]
